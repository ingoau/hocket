[package]
name = "hocket-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hocket shared core: session document, queue reducer, Connect protocol, library mirror, outbox, DSP and audio."

[features]
default = ["mdns"]
# Symphonia decoding + cpal output. Used by desktop and the coordinator never needs it.
native-audio = ["dep:symphonia", "dep:cpal", "dep:rubato"]
# LAN discovery. Off on the headless coordinator.
mdns = ["dep:mdns-sd"]
# Deterministic simulation harness (virtual clock, in-memory network). Also used by the coordinator's tests.
sim = ["dep:tempfile"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
typeshare.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
tracing.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
rand.workspace = true
rand_chacha.workspace = true
uuid.workspace = true
md-5.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
url.workspace = true
parking_lot.workspace = true
indexmap.workspace = true
bytes.workspace = true
base64.workspace = true
mdns-sd = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
