[package]
name = "hocket-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "napi-rs addon of hocket-core for the Electron desktop app, plus the playwire OS media-session adapter."

[lib]
crate-type = ["cdylib"]

[features]
default = ["media-session"]
# OS media controls through playwire (MPRIS via zbus on Linux, SMTC on Windows,
# MPNowPlayingInfoCenter on macOS). Off => `MediaSession` reports unsupported and
# the app degrades to no OS integration; it never blocks the build.
media-session = ["dep:playwire"]

[dependencies]
hocket-core = { workspace = true, features = ["native-audio", "mdns", "automix-analysis"] }
napi.workspace = true
napi-derive.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
playwire = { workspace = true, optional = true }

# Trackpad haptics and scroll-gesture phases for the desktop's swipe gestures (src/gestures.rs).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSEvent", "NSHapticFeedback"] }

[build-dependencies]
napi-build.workspace = true
