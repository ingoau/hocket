name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly fuzzing (the `fuzz` job below); also runnable by hand.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core
    # The weekly schedule exists for the fuzz job only.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  desktop:
    name: Desktop
    # The weekly schedule exists for the fuzz job only.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config xvfb
      - run: cargo install typeshare-cli
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm gen
        working-directory: desktop
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
        working-directory: desktop
      # A screen larger than the default 1280x1024: the immersive layout tests size the window to
      # 1456x912 (3:2), which a smaller screen would clamp.
      - run: xvfb-run -a -s "-screen 0 2000x1600x24" pnpm test:e2e
        working-directory: desktop

  pebble:
    name: Pebble watchapp
    # The weekly schedule exists for the fuzz job only.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install pebble-tool && pebble sdk install latest
      - run: scripts/build-pebble.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hocket-pbw
          path: pebble/build/android-assets/hocket.pbw

  android:
    name: Android
    # The weekly schedule exists for the fuzz job only. Runs even when the pebble job failed (a
    # Pebble SDK install problem shouldn't hide Android results); the APK then has no watchapp.
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    # The APK bundles the watchapp the pebble job built, when there is one.
    needs: pebble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.pebble.result == 'success'
        with:
          name: hocket-pbw
          path: pebble/build/android-assets
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the legacy `tools` package, which the
          # SDK repository no longer serves.
          packages: platform-tools
      - run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-37.1" "build-tools;36.0.0" "ndk;27.2.12479018"
      - run: cargo install cargo-ndk typeshare-cli
      - run: scripts/gen-bindings.sh
      - run: scripts/build-android-core.sh release
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug :app:lintDebug
        working-directory: android
      # Release APK for pushes to main (published by the release job): versionName 0.1.<run number>
      # and a versionCode that only goes up. Signed with the key the installed app already uses.
      - name: Build release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: android
        env:
          HOCKET_KEYSTORE_B64: ${{ secrets.HOCKET_KEYSTORE_B64 }}
          HOCKET_KEYSTORE_PASSWORD: ${{ secrets.HOCKET_KEYSTORE_PASSWORD }}
          HOCKET_KEY_ALIAS: ${{ secrets.HOCKET_KEY_ALIAS }}
          HOCKET_KEY_PASSWORD: ${{ secrets.HOCKET_KEY_PASSWORD }}
        run: |
          if [ -z "$HOCKET_KEYSTORE_B64" ]; then
            echo "::error::HOCKET_KEYSTORE_B64 isn't set; refusing to publish an unsigned APK"
            exit 1
          fi
          echo "$HOCKET_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export HOCKET_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}
          rm "$RUNNER_TEMP/release.jks"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hocket-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  desktop-dist:
    name: Desktop package (${{ matrix.os }})
    # Installers for the release job; pushes to main only. One OS failing doesn't hold back the
    # others or the release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo install typeshare-cli
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm pkg set version=0.1.${{ github.run_number }}
        working-directory: desktop
      - run: pnpm gen
        working-directory: desktop
      # Unsigned (no signing identity is configured; don't go looking for one on the runner).
      - run: pnpm dist --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: hocket-desktop-${{ runner.os }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: error

  release:
    name: Release
    # Every push to main is a pre-release, v0.1.<run number>, once the signed APK exists. The
    # watchapp and desktop installers go on it when their jobs succeeded.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.android.result == 'success' }}
    needs: [pebble, android, desktop-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp artifacts/hocket-apk/app-release.apk "dist/hocket-$VERSION.apk"
          if [ -f artifacts/hocket-pbw/hocket.pbw ]; then
            cp artifacts/hocket-pbw/hocket.pbw "dist/hocket-$VERSION.pbw"
          fi
          find artifacts -path 'artifacts/hocket-desktop-*' -type f -exec cp {} dist/ \;
          ls -l dist
          git log -1 --format=%B > notes.md
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" --title "Hocket $VERSION" --notes-file notes.md --prerelease

  fuzz:
    name: Fuzz (${{ matrix.target }})
    # Scheduled and manual runs only; never on pushes or PRs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - wire_decode
          - subsonic_envelope
          - lyrics_lrc
          - lyrics_structured
          - lyrics_cursor
          - config_import
          - nsp_import
          - api_json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - run: cargo install cargo-fuzz --locked
      # New inputs go to a scratch corpus; the committed seeds stay read-only.
      - run: |
          mkdir -p work/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} work/${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -max_total_time=300 -timeout=10 -rss_limit_mb=2048 -max_len=65536 -print_final_stats=1
        working-directory: fuzz
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
