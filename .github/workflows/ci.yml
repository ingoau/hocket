name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly fuzzing (the `fuzz` job below); also runnable by hand.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config xvfb
      - run: cargo install typeshare-cli
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm gen
        working-directory: desktop
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
        working-directory: desktop
      - run: xvfb-run -a pnpm test:e2e
        working-directory: desktop

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;27.2.12479018"
      - run: cargo install cargo-ndk typeshare-cli
      - run: scripts/gen-bindings.sh
      - run: scripts/build-android-core.sh release
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug :app:lintDebug
        working-directory: android

  fuzz:
    name: Fuzz (${{ matrix.target }})
    # Scheduled and manual runs only; never on pushes or PRs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - wire_decode
          - subsonic_envelope
          - lyrics_lrc
          - lyrics_structured
          - lyrics_cursor
          - config_import
          - nsp_import
          - api_json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - run: cargo install cargo-fuzz --locked
      # New inputs go to a scratch corpus; the committed seeds stay read-only.
      - run: |
          mkdir -p work/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} work/${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -max_total_time=300 -timeout=10 -rss_limit_mb=2048 -max_len=65536 -print_final_stats=1
        working-directory: fuzz
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
