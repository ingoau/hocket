name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config xvfb
      - run: cargo install typeshare-cli
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm gen
        working-directory: desktop
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
        working-directory: desktop
      - run: xvfb-run -a pnpm test:e2e
        working-directory: desktop

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;27.2.12479018"
      - run: cargo install cargo-ndk typeshare-cli
      - run: scripts/gen-bindings.sh
      - run: scripts/build-android-core.sh release
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug :app:lintDebug
        working-directory: android
