// Classes the Compose compiler takes as stable, so composables taking them can skip
// (wired in build.gradle.kts, composeCompiler). Only types nothing mutates belong here.

// The core's API types (core/.../api/Generated.kt, generated by typeshare): data classes, sealed
// classes and enums of vals, built from the core's JSON and never changed after. (Their few
// HashMaps, request headers and unknown fields, are read only.) `**` takes the sealed classes' nested
// subclasses too.
app.hocket.core.api.**

// Kotlin's read-only collection interfaces: the app hands composables lists it never mutates.
kotlin.collections.*
